# Compila los ejecutables del agente para los tres sistemas.
#
# En Windows el agente es C# (agente/windows): un .exe con el agente, la
# ventana y el servicio, que al abrirlo conecta, se instala como servicio y
# enseña cómo va. Sale uno para x86 (Windows de 32 bits) y otro para x64.

name: binarios del agente

on:
  push: { tags: ['v*'] }
  workflow_dispatch:

jobs:
  compilar:
    strategy:
      matrix:
        include:
          - so: ubuntu-latest
            nombre: print-server-agente-linux-x64
            salida: print-server-agente
          - so: macos-latest
            nombre: print-server-agente-macos-arm64
            salida: print-server-agente
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - working-directory: agente
        run: |
          dart pub get
          dart compile exe bin/print_server_agente.dart -o ${{ matrix.salida }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: agente/${{ matrix.salida }}

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: agente/windows/compilar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: print-server-agente-windows
          path: |
            agente/windows/dist/print-server-agente-windows-x86.exe
            agente/windows/dist/print-server-agente-windows-x64.exe

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - working-directory: hub
        run: |
          dart pub get
          dart compile exe bin/print_server_hub.dart -o print-server-hub
      - uses: actions/upload-artifact@v4
        with:
          name: print-server-hub-linux-x64
          path: |
            hub/print-server-hub
            hub/migraciones
