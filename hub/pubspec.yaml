name: print_server_hub
description: Hub de print-server — REST, WebSocket de agentes y web manager.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'

# Dos dependencias a propósito. Quien clone esto tiene que poder compilarlo sin
# arrastrar medio ecosistema; el HTTP y el WebSocket los da dart:io.
dependencies:
  postgres: ^3.1.0
  crypto: ^3.0.0

dev_dependencies:
  test: ^1.24.0
  lints: ^4.0.0
