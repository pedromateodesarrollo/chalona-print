# Vhost nginx para TU-DOMINIO → hub de print-server (127.0.0.1:3070).
#
# Instalar:
#   sudo cp nginx-hub.conf /etc/nginx/sites-available/TU-DOMINIO
#   sudo ln -s /etc/nginx/sites-available/TU-DOMINIO /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d TU-DOMINIO
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requisito previo: DNS A de TU-DOMINIO → IP del box.

map $http_upgrade $connection_upgrade_print {
    default upgrade;
    ''      close;
}

server {
    server_name TU-DOMINIO;

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade_print;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un trabajo puede ser un PDF; el tope real lo pone PRINT_MAX_TRABAJO_MB
        # en el servicio, esto solo evita que nginx corte antes.
        client_max_body_size 32m;

        # Los agentes viven colgados de un WebSocket durante días. Sin esto,
        # nginx los corta cada minuto y reconectan sin parar.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 80;
    listen [::]:80;
}
